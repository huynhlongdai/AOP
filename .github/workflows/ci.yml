name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Validate PostgreSQL coordination primitives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: aop
          POSTGRES_PASSWORD: aop
          POSTGRES_DB: aop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aop -d aop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aop:aop@127.0.0.1:5432/aop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply migrations
        run: |
          for migration in packages/database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Validate database constraints
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/tests/slice0_constraints.sql

      - name: Validate Query Store against PostgreSQL
        run: pnpm exec vitest run packages/database/src/query-store.integration.test.ts

      - name: Validate durable Outbox against PostgreSQL
        run: pnpm exec vitest run packages/event-bus/src/outbox-store.integration.test.ts

      - name: Validate task.claim coordination against PostgreSQL
        run: pnpm exec vitest run packages/database/src/task-claim.integration.test.ts

      - name: Validate Scheduler candidates against PostgreSQL
        run: pnpm exec vitest run packages/scheduler/src/postgres-candidate-store.integration.test.ts

      - name: Validate lease heartbeat and recovery against PostgreSQL
        run: pnpm exec vitest run packages/database/src/lease-recovery.integration.test.ts

      - name: Validate Artifact write path against PostgreSQL
        run: pnpm exec vitest run packages/database/src/artifact-write.integration.test.ts

      - name: Validate Artifact review lifecycle against PostgreSQL
        run: pnpm exec vitest run packages/database/src/artifact-lifecycle.integration.test.ts

      - name: Validate Artifact consumer invalidation against PostgreSQL
        run: pnpm exec vitest run packages/database/src/artifact-consumer-invalidation.integration.test.ts

      - name: Validate Task QA review lifecycle against PostgreSQL
        run: pnpm exec vitest run packages/database/src/task-review.integration.test.ts

      - name: Validate Decision authority and supersession against PostgreSQL
        run: pnpm exec vitest run packages/database/src/decision-governance.integration.test.ts

      - name: Validate verified organizational reporting against PostgreSQL
        run: pnpm exec vitest run packages/database/src/reporting-store.integration.test.ts

      - name: Validate exact Context Manifest compilation against PostgreSQL
        run: pnpm exec vitest run packages/database/src/context-manifest-store.integration.test.ts

      - name: Validate authoritative Runtime lifecycle against PostgreSQL
        run: pnpm exec vitest run packages/database/src/runtime-lifecycle.integration.test.ts

      - name: Validate Runtime Manager control plane against PostgreSQL
        run: pnpm exec vitest run apps/worker/src/runtime-manager-control-plane.integration.test.ts
